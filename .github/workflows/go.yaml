# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.5'

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: v2.6

    - name: Build
      run: make build

    - name: Test
      env:
        DODO_LLM_API_KEY: ${{ secrets.DODO_LLM_API_KEY }}
      run: go test -v ./...
